name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  # Types, lint and build. Catches what a compiler can catch.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next lint --max-warnings=0
      # Whether a headline is bullish or bearish for gold. tsc cannot see a
      # wrong sign, and neither can a reader of the alert — a de-escalation
      # story sent as a reason gold should rise looks like a working alert.
      - run: npx tsx scripts/eventDirection.test.mts
      # Whether a signal won or lost. This decides what the app claims about its
      # own accuracy, and the tempting errors all point the same way — counting a
      # target reached after the stop, or assuming the good side of a bar that
      # touched both.
      - run: npx tsx scripts/signalOutcome.test.mts
      # When to push a wave-count change. Confirming too eagerly spams the
      # channel; confirming too strictly never announces a real change. Neither
      # raises an error.
      - run: npx tsx scripts/waveAlert.test.mts
      # Subscribe and unsubscribe. A stranger drives this one, and each way it
      # breaks is quiet: duplicate alerts, alerts after asking to stop, or a
      # list that fills with people who left.
      - run: npx tsx scripts/subscribers.test.mts
      # Which tier a route needs. A page added inside a gated area used to be
      # ungated by default, which is not a mistake anyone makes — it is what
      # adding a page did.
      - run: npx tsx scripts/tierGating.test.mts
      # Values coming back out of the store the way they went in. A string that
      # read back as "absent" made callers mint a replacement, which is how the
      # webhook secret rotated on every request.
      - run: npx tsx scripts/kvStore.test.mts
      # Codes linking a Telegram chat to an app account. A code is a bearer
      # token for someone's tier, so single use and a strict format are the
      # whole of its security.
      - run: npx tsx scripts/linkCode.test.mts
      # Who receives which alert. Gate too tightly and someone who paid stops
      # receiving with no error; too loosely and the paid alert is free. The
      # channel is the trap: it has one audience and no tiers.
      - run: npx tsx scripts/alertTier.test.mts
      # Whether a proposed trade is allowed through. Blocking what should pass
      # goes quiet for weeks with no sign why; letting through what should be
      # blocked emits exactly the trades measured as losing.
      - run: npx tsx scripts/waveFilter.test.mts
      - run: npx next build
        env:
          # The build only needs these to exist. Real values live in Vercel;
          # nothing here reads live data.
          NEXTAUTH_SECRET: ci-placeholder
          NEXTAUTH_URL: http://localhost:3100

  # The checks that actually caught things: prices matching the market, routes
  # not fabricating numbers, fetches carrying a deadline. None of it is visible
  # to tsc or eslint — see scripts/audit.mjs.
  #
  # Runs against the deployed site rather than a CI server, because the point is
  # to check what users are being served. It needs the public internet (Binance,
  # CBOE, CFTC), so a network blip is a flaky failure, not a code failure —
  # hence continue-on-error. Read the log; do not assume green means checked.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Vercel deploy to pick up this commit
        run: sleep 120
      - run: node scripts/audit.mjs https://gold-intelligence-os.vercel.app
